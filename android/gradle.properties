# إعدادات ذاكرة JVM لـ Gradle (تم دمجها برفع الذاكرة لمنع مشاكل الـ Daemon)
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# استراتيجية تجميع Kotlin داخل العملية لمنع فشل الاتصال بالـ Daemon
kotlin.compiler.execution.strategy=in-process

# إعدادات Android و Flutter
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false