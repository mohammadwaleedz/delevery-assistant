name: whatsapp_route_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  
  # الخريطة والتوجيه (الإصدار الأحدث المتوافق مع الـ SDK المرتفع)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^10.1.1
